<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Конвертер валюты</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=cached" />
</head>
<body>
    <header class="flex-container heads center-hor">
        <span>Конвертер валюты</span>
        <span>значок</span>
    </header>

    <div class="flex-container currency-value center-vert center-hor">
        <input type="number" min="0" id="first-input" placeholder="Значение">        
        <input type="number" min="0" id="second-input" placeholder="Значение">
    </div>

    <div class="flex-container currency center-vert center-hor">
        <input list="currency" class="currency" id="first-currency" type="text" placeholder="Валюта">
        <svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width=48px fill="#FFFFFF"><path d="M481-158q-131 0-225.5-94.5T161-478v-45l-80 80-39-39 149-149 149 149-39 39-80-80v45q0 107 76.5 183.5T481-218q29 0 55-5t49-15l43 43q-36 20-72.5 28.5T481-158Zm289-169L621-476l40-40 79 79v-41q0-107-76.5-183.5T480-738q-29 0-55 5.5T376-719l-43-43q36-20 72.5-28t74.5-8q131 0 225.5 94.5T800-478v43l80-80 39 39-149 149Z"/></svg>
        <input list="currency" class="currency" id="second-currency" type="text" placeholder="Валюта">
        
        <datalist id="currency">
            <option value="USD"></option>
            <option value="RUB"></option>
        </datalist>
    </div>

    <footer class="flex-container heads center-hor">
        <a href="https://github.com/WhiteBunnyI/Currency-converter/tree/main">Github</a>
    </footer>
</body>
</html>
